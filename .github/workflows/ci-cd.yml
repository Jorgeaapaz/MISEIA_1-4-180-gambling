name: CI/CD — Test, Build & Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build (production)
        run: npm run build
        env:
          NODE_ENV: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: gambling
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAILHOG_HOST: mailhog
          MAIL_PORT: '1025'
          MAIL_FROM: noreply@gambling.local
          REDSYS_MERCHANT_CODE: '999008881'
          REDSYS_TERMINAL: '1'
          REDSYS_SECRET_KEY: ${{ secrets.REDSYS_SECRET_KEY }}
          REDSYS_URL: https://sis-t.redsys.es:25443/sis/realizarPago
          REDSYS_NOTIFICATION_URL: https://gambling.deviaaps.com/api/payments/notify
          REDSYS_OK_URL: https://gambling.deviaaps.com/payments/ok
          REDSYS_KO_URL: https://gambling.deviaaps.com/payments/ko
          NEXT_PUBLIC_API_URL: https://gambling.deviaaps.com

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            public/
            package.json
            package-lock.json
          retention-days: 1
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

  deploy:
    name: Deploy to GCI VM
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      - name: Add VM to known hosts
        run: ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to VM
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env*' \
            . ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/MISEIA1-4-180-gambling/

      - name: Write production env and restart container
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'SSHEOF'
            cd ~/MISEIA1-4-180-gambling
            cat > .env.production << EOF
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          MONGODB_DB=gambling
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          MAILHOG_HOST=mailhog
          MAIL_PORT=1025
          MAIL_FROM=noreply@gambling.local
          REDSYS_MERCHANT_CODE=999008881
          REDSYS_TERMINAL=1
          REDSYS_SECRET_KEY=${{ secrets.REDSYS_SECRET_KEY }}
          REDSYS_URL=https://sis-t.redsys.es:25443/sis/realizarPago
          REDSYS_NOTIFICATION_URL=https://gambling.deviaaps.com/api/payments/notify
          REDSYS_OK_URL=https://gambling.deviaaps.com/payments/ok
          REDSYS_KO_URL=https://gambling.deviaaps.com/payments/ko
          NEXT_PUBLIC_API_URL=https://gambling.deviaaps.com
          NODE_ENV=production
          EOF
            docker compose -f docker-compose.gambling.yml up -d --build --force-recreate
          SSHEOF

      - name: Health check
        run: |
          sleep 15
          curl -f https://gambling.deviaaps.com/api/matches || \
          curl -f https://gambling.deviaaps.com/
