stages:
  - test
  - build
  - deploy

lint-and-test:
  stage: test
  image: node:20-alpine
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run lint
    - npm run test:unit

build:
  stage: build
  image: node:20-alpine
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/
  script:
    - npm ci
    - NODE_ENV=production npm run build
  artifacts:
    paths:
      - .next/
      - public/
      - package.json
      - package-lock.json
    expire_in: 1 hour
  only:
    - master
    - main

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - echo "$VM_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H 34.174.56.186 >> ~/.ssh/known_hosts
  script:
    - rsync -avz --delete
        --exclude='.git'
        --exclude='node_modules'
        --exclude='.env*'
        . $VM_USER@34.174.56.186:~/MISEIA1-4-180-gambling/
    - |
      ssh $VM_USER@34.174.56.186 bash << SSHEOF
        cd ~/MISEIA1-4-180-gambling
        cat > .env.production << EOF
      MONGODB_URI=${MONGODB_URI}
      MONGODB_DB=gambling
      JWT_SECRET=${JWT_SECRET}
      MAILHOG_HOST=mailhog
      MAIL_PORT=1025
      MAIL_FROM=noreply@gambling.local
      REDSYS_MERCHANT_CODE=999008881
      REDSYS_TERMINAL=1
      REDSYS_SECRET_KEY=${REDSYS_SECRET_KEY}
      REDSYS_URL=https://sis-t.redsys.es:25443/sis/realizarPago
      REDSYS_NOTIFICATION_URL=https://gambling.deviaaps.com/api/payments/notify
      REDSYS_OK_URL=https://gambling.deviaaps.com/payments/ok
      REDSYS_KO_URL=https://gambling.deviaaps.com/payments/ko
      NEXT_PUBLIC_API_URL=https://gambling.deviaaps.com
      NODE_ENV=production
      EOF
        docker compose -f docker-compose.gambling.yml up -d --build --force-recreate
      SSHEOF
  environment:
    name: production
    url: https://gambling.deviaaps.com
  only:
    - master
    - main
